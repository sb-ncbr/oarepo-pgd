[project]
name = "oarepo-pgd"
version = "0.1.0"
description = "Profile-guided deposition for CESNET Invenio (OARepo) repositories."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<3.15"
# Tested with oarepo-app 8 (OARepo 14.2, InvenioRDM 14).
dependencies = [
    "oarepo-model>=7.0.0,<8.0.0",
    "oarepo-ui>=14.0.0,<15.0.0",
    "PyYAML",
    "jsonschema",
]

[project.urls]
Repository = "https://github.com/sb-ncbr/oarepo-pgd"

[project.optional-dependencies]
tests = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oarepo_pgd"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
