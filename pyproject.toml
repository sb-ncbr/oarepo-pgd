[project]
name = "oarepo-pgd"
version = "0.3.0"
description = "Profile-guided deposition for CESNET Invenio (OARepo) repositories."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<3.15"
# Tested with oarepo-app 8 (OARepo 14.2, InvenioRDM 14).
dependencies = [
    "oarepo-model>=7.0.0,<8.0.0",
    "oarepo-ui>=14.0.0,<15.0.0",
    "PyYAML",
    "jsonschema",
]

[project.urls]
Repository = "https://github.com/sb-ncbr/oarepo-pgd"

[project.optional-dependencies]
tests = ["pytest"]

# The Flask extension registers the deposit-form overrides for the UI app, the API
# blueprint serves the configuration to other software, and the webpack bundle ships
# the form components.
[project.entry-points."invenio_base.apps"]
oarepo_pgd = "oarepo_pgd.ext:OARepoPGD"

[project.entry-points."invenio_base.finalize_app"]
oarepo_pgd = "oarepo_pgd.ext:finalize_app"

[project.entry-points."invenio_base.api_blueprints"]
oarepo_pgd = "oarepo_pgd.views:create_api_blueprint"

[project.entry-points."invenio_i18n.translations"]
oarepo_pgd = "oarepo_pgd"

[project.entry-points."invenio_assets.webpack"]
oarepo_pgd = "oarepo_pgd.theme.webpack:theme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oarepo_pgd"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
